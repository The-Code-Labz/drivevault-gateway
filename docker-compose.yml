services:
  drivevault:
    # Images are built and published by .github/workflows/publish.yml on tag push (vX.Y.Z).
    # Pin DRIVEVAULT_IMAGE_TAG to a released version for reproducible, rollback-able deploys —
    # the :latest default below is convenient but not reproducible.
    image: ghcr.io/the-code-labz/drivevault-gateway:${DRIVEVAULT_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: drivevault-gateway
    ports:
      - "4050:4050"
    environment:
      - NODE_ENV=production
      - PORT=4050
      - API_KEY=${API_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - GOOGLE_SERVICE_ACCOUNT_JSON=${GOOGLE_SERVICE_ACCOUNT_JSON}
      - GOOGLE_SERVICE_ACCOUNT_JSON_PATH=${GOOGLE_SERVICE_ACCOUNT_JSON_PATH}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - GOOGLE_OAUTH_REFRESH_TOKEN=${GOOGLE_OAUTH_REFRESH_TOKEN}
      # Must exactly match the redirect URI registered on the OAuth client
      # (<this>/api/oauth/callback). Visit /api/oauth/connect once in a
      # browser to complete login — the refresh token is then written to
      # ./data/oauth-tokens.json automatically, no restart needed.
      - OAUTH_REDIRECT_BASE_URL=${OAUTH_REDIRECT_BASE_URL}
      - GOOGLE_DRIVE_ROOT_FOLDER_ID=${GOOGLE_DRIVE_ROOT_FOLDER_ID:-root}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://localhost:4050}
      - S3_REGION=${S3_REGION:-us-east-1}
    volumes:
      - ./data:/app/data
      # If using GOOGLE_SERVICE_ACCOUNT_JSON_PATH, drop the key file at
      # ./data/service-account.json on the host (or edit the filename below).
      # This mount forces it to land at that EXACT container path, even if the
      # env var value doesn't happen to already live under /app/data.
      - ./data/service-account.json:${GOOGLE_SERVICE_ACCOUNT_JSON_PATH:-/app/data/service-account.json}
    restart: unless-stopped
